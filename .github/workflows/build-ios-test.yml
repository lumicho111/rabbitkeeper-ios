name: Build unsigned iOS test IPA

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch/tag/SHA of the web source (test only)'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout iOS release configuration
        uses: actions/checkout@v4
        with:
          path: distribution

      - name: Checkout application source (read only)
        uses: actions/checkout@v4
        with:
          repository: lumicho111/raccoonphonetest
          ref: ${{ inputs.source_ref }}
          path: app
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Xcode
        run: |
          xcodebuild -version
          pod --version

      - name: Install dependencies
        working-directory: app
        run: |
          npm ci
          npm install --no-save --package-lock=false @capacitor/ios@6.2.1

      - name: Build mobile web bundle
        working-directory: app
        run: npm run android:web

      - name: Create iOS project for this build
        working-directory: app
        run: |
          npx cap add ios
          npx cap sync ios
          test -f ios/App/App.xcworkspace/contents.xcworkspacedata

      - name: Build unsigned device app
        working-directory: app
        run: |
          VERSION=$(node -p "require('./mobile/version.json').versionName")
          BUILD=$(node -p "require('./mobile/version.json').versionCode")
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=app.ii.phone \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            build

      - name: Package unsigned IPA for sideloading test
        working-directory: app
        run: |
          APP_PATH="$RUNNER_TEMP/ios-derived/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/RabbitKeeper.app"
          VERSION=$(node -p "require('./mobile/version.json').versionName")
          BUILD=$(node -p "require('./mobile/version.json').versionCode")
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/ipa/Payload/RabbitKeeper.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/ipa/Payload/RabbitKeeper.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/ipa/Payload/RabbitKeeper.app/Info.plist"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/RabbitKeeper-unsigned-${VERSION}-${BUILD}.ipa" Payload

      - name: Upload test artifact (not published to Releases)
        uses: actions/upload-artifact@v4
        with:
          name: RabbitKeeper-iOS-unsigned-test
          path: RabbitKeeper-unsigned-*.ipa
          if-no-files-found: error
          retention-days: 7
